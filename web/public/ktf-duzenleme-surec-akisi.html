<style>
  :root{--bg:#f7f8fa;--grid:#e6e9ee;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  #topbar{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:10;font-size:14px}
  #topbar h1{font-size:15px;margin:0;font-weight:650;color:#111827}
  #topbar .sub{color:#6b7280;font-size:12.5px;margin-left:10px}
  #legend{display:flex;gap:14px;align-items:center;font-size:12px;color:#4b5563}
  #legend .sw{display:inline-flex;align-items:center;gap:5px}
  #legend .line{width:20px;height:0;border-top:2px solid #94a3b8;display:inline-block}
  #legend .line.jump{border-top:2px dashed #2f6fed}
  #legend .line.back{border-top:2px dashed #e05b4f}
  #controls{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:10}
  #controls button{width:34px;height:34px;border-radius:8px;border:1px solid #d1d5db;background:#fff;font-size:16px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  #controls button:hover{background:#f3f4f6}
  #viewport{position:absolute;top:56px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
  #viewport.dragging{cursor:grabbing}
  #stage{transform-origin:0 0;position:absolute;top:0;left:0}
  svg{display:block;background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/22px 22px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/22px 22px,
    var(--bg);}
  .pnode{cursor:pointer;transition:opacity .15s}
  .pnode text{pointer-events:none;font-family:inherit}
  .node-kind{font-size:9px;letter-spacing:.04em;fill:#6b7280;text-anchor:middle;text-transform:uppercase}
  .node-title{font-size:11.5px;font-weight:600;fill:#111827;text-anchor:middle}
  .node-title-d{font-size:10.5px;font-weight:600;fill:#111827;text-anchor:middle}
  .node-svc{font-size:9px;fill:#7c6fe0;text-anchor:middle}
  .node-x{font-size:13px;fill:#c8952e;text-anchor:middle;font-weight:700}
  .kind-task .node-kind, .kind-service .node-kind{text-anchor:start}
  .kind-task .node-title, .kind-service .node-title{text-anchor:start}
  .kind-other .node-kind{text-anchor:start}
  .kind-other .node-title{text-anchor:start}
  .edge path{fill:none;stroke:#a8b0bc;stroke-width:1.5}
  .edge.edge-jump path{stroke:#2f6fed;stroke-width:1.3;stroke-dasharray:5 4;opacity:.55}
  .edge.edge-back path{stroke:#e05b4f;stroke-width:1.3;stroke-dasharray:5 4;opacity:.55}
  .edge-label-bg{fill:#fff;opacity:.9}
  .edge-label{font-size:9.5px;fill:#475569;text-anchor:start}
  .edge.dim{opacity:.08}
  .pnode.dim{opacity:.16}
  .edge.onpath path{stroke:#2f6fed !important;stroke-width:2.4 !important;opacity:1 !important;stroke-dasharray:none !important}
  .pnode.onpath{opacity:1}
  .pnode.onpath rect, .pnode.onpath polygon, .pnode.onpath circle{stroke:#2f6fed;stroke-width:2.6}

  .node-label-box{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-break:break-word;font:600 11px/1.2 -apple-system,'Segoe UI',sans-serif;color:#111827;width:100%;height:100%}
  .node-svc-box{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:9px/1.2 -apple-system,'Segoe UI',sans-serif;color:#7c6fe0;width:100%}
</style></head>

const viewport = document.getElementById('viewport');
const stage = document.getElementById('stage');
let scale = 0.42, tx = 20, ty = 20, dragging = false, lastX = 0, lastY = 0;
function apply(){ stage.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
function fit(){
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const svg = document.getElementById('svg');
  const sw = +svg.getAttribute('width'), sh = +svg.getAttribute('height');
  scale = Math.min(vw/sw, vh/sh) * 0.94;
  tx = (vw - sw*scale)/2; ty = (vh - sh*scale)/2;
  apply();
}
viewport.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; viewport.classList.add('dragging'); });
window.addEventListener('pointerup', ()=>{ dragging=false; viewport.classList.remove('dragging'); });
window.addEventListener('pointermove', e=>{
  if(!dragging) return;
  tx += e.clientX-lastX; ty += e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; apply();
});
viewport.addEventListener('wheel', e=>{
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const prev = scale;
  scale = Math.min(2.4, Math.max(0.08, scale * (e.deltaY>0 ? 0.9 : 1.1)));
  tx = mx - (mx-tx) * (scale/prev);
  ty = my - (my-ty) * (scale/prev);
  apply();
}, {passive:false});
document.getElementById('zin').onclick = ()=>{ scale=Math.min(2.4,scale*1.2); apply(); };
document.getElementById('zout').onclick = ()=>{ scale=Math.max(0.08,scale*0.8); apply(); };
document.getElementById('zfit').onclick = fit;

// Full transitive ancestor/descendant set — used only when the user PINS a
// node (click), since on a hub node (e.g. a shared "Reddet") this can touch
// most of the graph and is only useful as a deliberate, stable view.
function fullPath(id){
  const anc = new Set(), desc = new Set();
  let stack=[id];
  while(stack.length){ const cur=stack.pop(); for(const p of (ADJ.parents[cur]||[])) if(p!==id && !anc.has(p)){anc.add(p); stack.push(p);} }
  stack=[id];
  while(stack.length){ const cur=stack.pop(); for(const c of (ADJ.children[cur]||[])) if(c!==id && !desc.has(c)){desc.add(c); stack.push(c);} }
  return new Set([id, ...anc, ...desc]);
}
// Immediate neighbours only (1-hop) — this is the default hover behaviour so
// hovering a busy hub node doesn't light up dozens of far-away rail edges at
// once; it only shows what feeds directly in/out of THAT node.
function neighbourPath(id){
  const parents = ADJ.parents[id] || [], children = ADJ.children[id] || [];
  return new Set([id, ...parents, ...children]);
}
const nodeEls = [...document.querySelectorAll('.pnode')];
const edgeEls = [...document.querySelectorAll('.edge')];
let pinnedId = null;
function clearClasses(){
  nodeEls.forEach(n=>n.classList.remove('dim','onpath'));
  edgeEls.forEach(e=>e.classList.remove('dim','onpath'));
}
function applyActive(active){
  nodeEls.forEach(n=> n.classList.toggle('dim', !active.has(n.dataset.id)));
  nodeEls.forEach(n=> n.classList.toggle('onpath', active.has(n.dataset.id)));
  edgeEls.forEach(e=>{
    const on = active.has(e.dataset.from) && active.has(e.dataset.to);
    e.classList.toggle('onpath', on);
    e.classList.toggle('dim', !on);
  });
}
function refresh(hoverId){
  if(pinnedId){ applyActive(fullPath(pinnedId)); return; }
  if(hoverId){ applyActive(neighbourPath(hoverId)); return; }
  clearClasses();
}
nodeEls.forEach(n=>{
  n.addEventListener('pointerenter', ()=> refresh(n.dataset.id));
  n.addEventListener('pointerleave', ()=> refresh(null));
  n.addEventListener('click', (e)=>{
    e.stopPropagation();
    pinnedId = (pinnedId === n.dataset.id) ? null : n.dataset.id;
    document.getElementById('pinhint').style.display = pinnedId ? 'inline-flex' : 'none';
    refresh(null);
  });
});
viewport.addEventListener('click', ()=>{ if(pinnedId){ pinnedId=null; document.getElementById('pinhint').style.display='none'; refresh(null);} });
window.addEventListener('resize', fit);

function parseXY(el){
  const m=/translate\(([-.\d]+),\s*([-.\d]+)\)/.exec(el.getAttribute('transform')||'');
  return m ? {x:+m[1], y:+m[2]} : {x:0,y:0};
}
function nodeBox(el){
  const {x,y}=parseXY(el);
  if(el.classList.contains('kind-start')||el.classList.contains('kind-end'))
    return {l:x+62,r:x+106,t:y+6,b:y+50,cx:x+84,cy:y+28};
  if(el.classList.contains('kind-decision'))
    return {l:x+58,r:x+110,t:y+2,b:y+54,cx:x+84,cy:y+28};
  return {l:x,r:x+168,t:y,b:y+56,cx:x+84,cy:y+28};
}
function pts(d){ return [...d.matchAll(/([-.\d]+)\s*,\s*([-.\d]+)/g)].map(m=>({x:+m[1],y:+m[2]})); }
function leavePort(box, from, to){
  const dx=to.x-from.x, dy=to.y-from.y;
  if(Math.abs(dx)>=Math.abs(dy)) return dx>=0 ? {x:box.r,y:box.cy} : {x:box.l,y:box.cy};
  return dy>=0 ? {x:box.cx,y:box.b} : {x:box.cx,y:box.t};
}
function enterPort(box, from, to){
  const dx=to.x-from.x, dy=to.y-from.y;
  if(Math.abs(dx)>=Math.abs(dy)) return dx>=0 ? {x:box.l,y:box.cy} : {x:box.r,y:box.cy};
  return dy>=0 ? {x:box.cx,y:box.t} : {x:box.cx,y:box.b};
}
function setFirst(d,x,y){ return d.replace(/M\s*[-.\d]+\s*,\s*[-.\d]+/, `M${x.toFixed(1)},${y.toFixed(1)}`); }
function setLast(d,x,y){ return d.replace(/([-.\d]+)\s*,\s*([-.\d]+)\s*$/, `${x.toFixed(1)},${y.toFixed(1)}`); }

function snapEdges(){
  const byId={};
  document.querySelectorAll('.pnode').forEach(n=> byId[n.id]=nodeBox(n));
  document.querySelectorAll('.edge path').forEach(path=>{
    const g=path.parentNode;
    const fb=byId[g.dataset.from], tb=byId[g.dataset.to];
    if(!fb||!tb) return;
    const orig=path.getAttribute('d');
    const p=pts(orig);
    if(p.length<2) return;
    const s=leavePort(fb, p[0], p[1]);
    const t=enterPort(tb, p[p.length-2], p[p.length-1]);
    let d=setFirst(orig,s.x,s.y);
    d=setLast(d,t.x,t.y);
    if(Math.abs(p[1].x-p[0].x)<1.5){
      d=d.replace(/^(M[-.\d.]+,)([-.\d.]+)(\s+L\s*)([-.\d.]+)/, (_,m,y,L)=> m+y+L+s.x.toFixed(1));
    }
    path.setAttribute('d', d);
  });
}

function wrapTaskTitles(){
  const ns='http://www.w3.org/2000/svg';
  const xhtml='http://www.w3.org/1999/xhtml';
  document.querySelectorAll('.pnode.kind-task, .pnode.kind-service, .pnode.kind-other').forEach(n=>{
    const titleEl=n.querySelector('.node-title');
    const svcEl=n.querySelector('.node-svc');
    const full=(n.querySelector('title')?.textContent||'').split('\n')[0].trim() || titleEl?.textContent || '';
    if(titleEl){
      titleEl.remove();
      const fo=document.createElementNS(ns,'foreignObject');
      fo.setAttribute('x','8'); fo.setAttribute('y','17');
      fo.setAttribute('width','152'); fo.setAttribute('height', svcEl ? '22' : '34');
      const div=document.createElement('div');
      div.setAttribute('xmlns', xhtml);
      div.className='node-label-box';
      div.textContent=full;
      fo.appendChild(div);
      n.appendChild(fo);
    }
    if(svcEl){
      const t=svcEl.textContent||'';
      svcEl.remove();
      const fo=document.createElementNS(ns,'foreignObject');
      fo.setAttribute('x','8'); fo.setAttribute('y','40');
      fo.setAttribute('width','152'); fo.setAttribute('height','12');
      const div=document.createElement('div');
      div.setAttribute('xmlns', xhtml);
      div.className='node-svc-box';
      div.setAttribute('title', t);
      div.textContent=t;
      fo.appendChild(div);
      n.appendChild(fo);
    }
  });
}

const marker=document.querySelector('#arrow');
if(marker){ marker.setAttribute('refX','10'); marker.setAttribute('markerWidth','6'); marker.setAttribute('markerHeight','6'); }

wrapTaskTitles();
snapEdges();

fit();
</script>
